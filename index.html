<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>트위터 성향표 메이커 - 완벽 일치 (삭제 기능 확실하게 추가됨)</title>
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');

        :root {
            --ui-bg: #f8fafc;
            --ui-border: #e2e8f0;
            --ui-accent: #8b80f9;
            --text-main: #334155;
            --chart-accent: #8b80f9; 
            --chart-box-bg: rgba(255, 255, 255, 0.75); 
        }

        body { font-family: 'Pretendard', sans-serif; background-color: #cbd5e1; margin: 0; display: flex; height: 100vh; overflow: hidden; color: var(--text-main); }

        /* === 에디터 패널 (좌측) === */
        #editor { width: 440px; background: white; overflow-y: auto; box-shadow: 4px 0 20px rgba(0,0,0,0.08); z-index: 1000; flex-shrink: 0; }
        .editor-header { padding: 20px 25px; background: white; border-bottom: 1px solid var(--ui-border); position: sticky; top: 0; z-index: 10; }
        .editor-header h2 { margin: 0; font-size: 1.15rem; color: var(--ui-accent); font-weight: 900; }
        .editor-content { padding: 20px; display: flex; flex-direction: column; gap: 20px; }
        .setting-card { background: var(--ui-bg); border-radius: 12px; padding: 18px; border: 1px solid var(--ui-border); }
        .setting-card h3 { margin: 0 0 15px 0; font-size: 0.85rem; border-bottom: 2px solid #e2e8f0; padding-bottom: 8px; font-weight: 800; }
        label { display: block; font-size: 0.75rem; margin-bottom: 6px; font-weight: 800; color: #64748b; }
        input[type="text"], textarea { width: 100%; padding: 10px; border: 1px solid var(--ui-border); border-radius: 8px; box-sizing: border-box; font-family: inherit; font-size: 0.85rem; margin-bottom: 12px; }
        .flex-row { display: flex; gap: 10px; }
        .flex-row > div { flex: 1; }
        .file-upload-btn { display: block; background: #e8e6f8; color: var(--ui-accent); padding: 10px; border-radius: 6px; font-size: 0.8rem; font-weight: 800; cursor: pointer; text-align: center; border: none; margin-bottom: 10px; }
        .file-upload-btn input[type="file"] { display: none; }
        .btn-clear { background: #fee2e2; color: #ef4444; border: none; padding: 6px 10px; border-radius: 6px; font-size: 0.7rem; cursor: pointer; font-weight: bold; margin-left: 10px;}
        
        /* 🔥 눈에 띄는 삭제 버튼 스타일 🔥 */
        .btn-delete { background: #fee2e2; color: #dc2626; border: 1px solid #fca5a5; padding: 6px 12px; border-radius: 6px; font-size: 0.75rem; cursor: pointer; font-weight: 900; transition: 0.2s; }
        .btn-delete:hover { background: #fca5a5; color: white; }

        /* 조절 UI */
        .crop-ui-box { background: white; border: 1px solid var(--ui-border); border-radius: 8px; padding: 15px; display: none; margin-bottom: 15px; }
        .crop-viewport { position: relative; margin: 0 auto; overflow: hidden; background: #f1f5f9; cursor: grab; border: 1px solid #cbd5e1; }
        .crop-viewport img { position: absolute; max-width: none; max-height: none; pointer-events: none; }
        .shape-circle { width: 120px; height: 120px; border-radius: 50%; }
        .shape-rect { width: 120px; aspect-ratio: 4/5; border-radius: 4px; }
        .shape-4cut { width: 120px; aspect-ratio: 3/2.2; border-radius: 2px; }
        .slider-wrap { display: flex; align-items: center; gap: 10px; font-size: 0.75rem; font-weight: 700; color: #64748b; margin-top: 10px; }
        input[type="range"] { flex: 1; accent-color: var(--ui-accent); cursor: pointer; }

        .tag-group { display: flex; flex-wrap: wrap; gap: 6px; }
        .tag-label { background: white; border: 1px solid var(--ui-border); padding: 6px 12px; border-radius: 20px; cursor: pointer; font-size: 0.75rem; font-weight: 600; color: #64748b; margin-bottom: 0; }
        .tag-label input { display: none; }
        .tag-label:has(input:checked) { border-color: var(--ui-accent); background: var(--ui-accent); color: white; }

        .btn-add { width: 100%; padding: 12px; background: white; border: 2px dashed #cbd5e1; color: #94a3b8; border-radius: 10px; cursor: pointer; font-weight: 800; margin-top: 5px; }
        .btn-save { width: calc(100% - 40px); margin: 0 20px 20px 20px; padding: 15px; background: var(--ui-accent); color: white; border: none; border-radius: 12px; cursor: pointer; font-weight: 800; font-size: 1rem; box-shadow: 0 4px 15px rgba(139,128,249,0.4); }

        /* === 캔버스 (우측) === */
        #canvas-wrapper { flex: 1; display: flex; align-items: flex-start; justify-content: center; overflow: auto; padding: 10px; }
        #capture-target { padding: 40px; background: transparent; display: flex; justify-content: center; align-items: center; }

        #preview-card { width: 1000px; min-height: 700px; height: fit-content; background: #fdfbf7; position: relative; border-radius: 20px; display: flex; align-items: center; justify-content: center; padding: 60px; box-sizing: border-box; overflow: hidden; box-shadow: 0 15px 40px rgba(0,0,0,0.1); }

        /* 성향표 중앙 */
        #central-chart { position: relative; width: 440px; z-index: 500; display: flex; flex-direction: column; gap: 12px; margin: auto; pointer-events: none; }
        .info-card { background: var(--chart-box-bg); padding: 20px 25px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.4); box-shadow: 0 4px 15px rgba(0,0,0,0.05); backdrop-filter: blur(10px); }
        
        .profile-row { display: flex; align-items: center; gap: 20px; }
        .out-viewport { position: relative; overflow: hidden; background: #eee; }
        .out-viewport img { position: absolute; max-width: none; max-height: none; }
        .out-pfp { width: 90px; height: 90px; border-radius: 50%; border: 3px solid var(--chart-accent); }
        
        .name-area h1 { margin: 0 0 5px 0; font-size: 1.4rem; font-weight: 900; color: #1e293b; display: flex; align-items: center; gap: 10px;}
        .name-area p { margin: 0; color: var(--chart-accent); font-size: 0.95rem; font-weight: 700; }
        .age-badge { padding: 4px 10px; font-size: 0.7rem; border-radius: 12px; font-weight: 800; display: none; }
        .badge-adult { background: var(--chart-accent); color: white; }
        .badge-minor { border: 2px solid var(--chart-accent); color: var(--chart-accent); background: white; }

        .card-title { font-size: 0.8rem; font-weight: 900; color: var(--chart-accent); border-bottom: 2px solid rgba(139, 128, 249, 0.2); padding-bottom: 6px; margin-bottom: 12px; display: block; }
        .basic-grid { display: flex; gap: 30px; font-size: 0.9rem; color: #475569; }
        .basic-grid b { color: #1e293b; font-weight: 800; margin-right: 8px; }
        .out-tag-list { display: flex; flex-wrap: wrap; gap: 6px; }
        .out-tag { padding: 5px 12px; border-radius: 20px; font-size: 0.8rem; background: #f1f5f9; color: #64748b; font-weight: 700; border: 1px solid #e2e8f0; }
        .out-tag.active { background: var(--chart-accent); color: white; border-color: var(--chart-accent); }
        .about-text { font-size: 0.9rem; line-height: 1.6; color: #334155; white-space: pre-wrap; font-weight: 500; }

        /* 장식 프레임 */
        .frame-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        .abs-frame { position: absolute; pointer-events: auto; } 
        
        .polaroid-frame { background: white; padding: 12px 12px 18px 12px; display: flex; flex-direction: column; align-items: center; border-radius: 4px; box-sizing: border-box; border: 1px solid transparent; }
        .out-pol { width: 180px; height: 210px; }
        .p-txt { margin-top: 12px; font-size: 0.9rem; font-weight: 800; color: #334155; text-align: center; }

        .four-cut { background: #111; padding: 12px; display: flex; flex-direction: column; gap: 8px; border-radius: 4px; box-sizing: border-box; border: 1px solid transparent; }
        .out-fc { width: 130px; height: 95px; }
        .fc-txt { text-align: center; font-size: 0.65rem; margin-top: 4px; font-weight: 900; letter-spacing: 1px; color: white; }

        .watermark { position: absolute; bottom: 20px; right: 25px; font-size: 11px; font-weight: 900; color: white; mix-blend-mode: difference; z-index: 2000; pointer-events: none; opacity: 0.7; }
    </style>
</head>
<body>

<div id="editor">
    <div class="editor-header"><h2>🎨 PROFILE MAKER</h2></div>
    <div class="editor-content">
        <div class="setting-card">
            <h3>🎨 테마 & 배경</h3>
            <div style="display:flex; gap:10px; align-items:center; margin-bottom:10px;">
                <label style="margin:0;">포인트 컬러</label>
                <input type="color" id="in-accent" value="#8b80f9" oninput="syncTheme()">
            </div>
            <div style="display:flex; gap:10px; align-items:center; margin-bottom:10px;">
                <label style="margin:0;">배경 그라데이션</label>
                <input type="color" id="bg-c1" value="#fdfbf7" oninput="syncTheme()">
                <input type="color" id="bg-c2" value="#e0dcf8" oninput="syncTheme()">
            </div>
            <div style="display:flex; align-items:center;">
                <label class="file-upload-btn" style="margin:0; flex:1;">배경 이미지 업로드<input type="file" id="bg-up" accept="image/*" onchange="upBg(this)"></label>
                <button class="btn-clear" onclick="clearBg()" style="margin-left:8px;">지우기</button>
            </div>
        </div>

        <div class="setting-card">
            <h3>👤 프로필 설정</h3>
            <label class="file-upload-btn">사진 선택<input type="file" accept="image/*" onchange="initCrop(this, 'pfp')"></label>
            <div class="crop-ui-box" id="pfp-ui">
                <div class="crop-viewport shape-circle" id="pfp-vp"><img id="pfp-img"></div>
                <div class="slider-wrap"><span>확대</span><input type="range" id="pfp-zoom" min="0.5" max="3" step="0.01" value="1"></div>
            </div>
            <div class="flex-row">
                <div><label>닉네임</label><input type="text" id="in-name" value="이름" oninput="syncText()"></div>
                <div><label>아이디</label><input type="text" id="in-handle" value="@아이디" oninput="syncText()"></div>
            </div>
            <label>연령대 표시</label>
            <div style="display:flex; gap:10px;">
                <label style="font-weight:normal; cursor:pointer;"><input type="radio" name="age-chk" value="성인" checked onchange="syncText()"> 성인</label>
                <label style="font-weight:normal; cursor:pointer;"><input type="radio" name="age-chk" value="미성년자" onchange="syncText()"> 미성년자</label>
                <label style="font-weight:normal; cursor:pointer;"><input type="radio" name="age-chk" value="none" onchange="syncText()"> 숨김</label>
            </div>
        </div>

        <div class="setting-card">
            <h3>📝 DETAILS & TENDENCY</h3>
            <div class="flex-row">
                <div><label>이별</label><input type="text" id="in-b1" value="블언블" oninput="syncText()"></div>
                <div><label>타장르</label><input type="text" id="in-b2" value="종합앵챗계" oninput="syncText()"></div>
            </div>
            <label>ABOUT</label>
            <textarea id="in-about" oninput="syncText()">내용이 길어지면 캔버스가 알아서 부드럽게 늘어납니다.</textarea>
            <label>성향 / 계정 성향</label>
            <div id="orient-tags" class="tag-group" style="margin-bottom:10px;"></div>
            <div id="acc-tags" class="tag-group"></div>
        </div>

        <div class="setting-card" id="fc-list">
            <h3>🎞️ LIFE 4-CUT</h3>
            <button class="btn-add" onclick="addFC()">+ 인생네컷 추가</button>
        </div>

        <div class="setting-card" id="p-list">
            <h3>📷 POLAROID</h3>
            <button class="btn-add" onclick="addPolaroid()">+ 폴라로이드 추가</button>
        </div>
    </div>
    <button class="btn-save" onclick="saveImage()">[ 고화질 이미지로 저장 ]</button>
</div>

<div id="canvas-wrapper">
    <div id="capture-target">
        <div id="preview-card">
            <div class="frame-layer" id="drag-layer"></div>
            <div id="central-chart">
                <div class="info-card profile-row">
                    <div class="out-viewport out-pfp" id="out-pfp-vp"><img id="out-pfp-img"></div>
                    <div class="name-area">
                        <h1 id="d-name">나비 <span class="age-badge" id="d-age">성인</span></h1>
                        <p id="d-handle">@hnrmp</p>
                    </div>
                </div>
                <div class="info-card">
                    <span class="card-title">BASIC</span>
                    <div class="basic-grid"><div><b>이별</b><span id="d-b1">블언블</span></div><div><b>장르</b><span id="d-b2">No</span></div></div>
                </div>
                <div class="info-card"><span class="card-title">TENDENCY</span><div class="out-tag-list" id="d-orient"></div></div>
                <div class="info-card"><span class="card-title">ACCOUNT</span><div class="out-tag-list" id="d-acc"></div></div>
                <div class="info-card"><span class="card-title">ABOUT</span><div class="about-text" id="d-about"></div></div>
            </div>
            <div class="watermark">@navi</div>
        </div>
    </div>
</div>

<script>
    const opts = {
        orient: ['HL', 'BL', 'GL', 'ALL', 'Dream', 'NCP'],
        acc: ['구독', '소비', '탐라 대화', 'RT/인용', '로그', '연성', 'AI 이미지', '사담', '마음']
    };
    let pCount = 0, fcCount = 0;

    function init() {
        ['orient', 'acc'].forEach(k => {
            const container = document.getElementById(`${k}-tags`);
            opts[k].forEach(v => { container.innerHTML += `<label class="tag-label"><input type="checkbox" value="${v}" onchange="syncTags()"><span>${v}</span></label>`; });
        });
        syncTheme(); syncText();
        
        // 기본 세팅
        addPolaroid(70, 150, -6); 
        addFC(720, 80, 8); 
    }

    function syncText() {
        document.getElementById('d-name').firstChild.nodeValue = document.getElementById('in-name').value + " ";
        document.getElementById('d-handle').innerText = document.getElementById('in-handle').value;
        document.getElementById('d-b1').innerText = document.getElementById('in-b1').value;
        document.getElementById('d-b2').innerText = document.getElementById('in-b2').value;
        document.getElementById('d-about').innerText = document.getElementById('in-about').value;
        const ageVal = document.querySelector('input[name="age-chk"]:checked').value;
        const badge = document.getElementById('d-age');
        if(ageVal === 'none') {
            badge.style.display = 'none';
        } else {
            badge.style.display = 'inline-block';
            badge.innerText = ageVal;
            badge.className = ageVal === '성인' ? 'age-badge badge-adult' : 'age-badge badge-minor';
        }
    }

    function syncTheme() {
        const accent = document.getElementById('in-accent').value;
        document.documentElement.style.setProperty('--chart-accent', accent);
        if(!document.getElementById('bg-up').files[0]) {
            document.getElementById('preview-card').style.background = `linear-gradient(135deg, ${document.getElementById('bg-c1').value}, ${document.getElementById('bg-c2').value})`;
        }
    }

    function upBg(input) {
        if(input.files[0]) {
            const reader = new FileReader();
            reader.onload = e => document.getElementById('preview-card').style.background = `url(${e.target.result}) center/cover no-repeat`;
            reader.readAsDataURL(input.files[0]);
        }
    }
    function clearBg() { document.getElementById('bg-up').value = ''; syncTheme(); }

    function syncTags() {
        ['orient', 'acc'].forEach(k => {
            const disp = document.getElementById(`d-${k}`);
            const checked = Array.from(document.querySelectorAll(`#${k}-tags input:checked`)).map(i => i.value);
            disp.innerHTML = opts[k].map(v => `<div class="out-tag ${checked.includes(v) ? 'active' : ''}">${v}</div>`).join('');
        });
    }

    function initCrop(input, idPrefix) {
        if(!input.files[0]) return;
        const reader = new FileReader();
        reader.onload = e => {
            document.getElementById(`${idPrefix}-ui`).style.display = 'block';
            const src = e.target.result;
            const inImg = document.getElementById(`${idPrefix}-img`);
            const outImg = document.getElementById(`out-${idPrefix}-img`);
            inImg.src = src; outImg.src = src;

            inImg.onload = function() {
                const vp = document.getElementById(`${idPrefix}-vp`);
                const outVp = document.getElementById(`out-${idPrefix}-vp`);
                const iw = inImg.naturalWidth, ih = inImg.naturalHeight;
                
                let curZoom = 1;
                const baseScale = Math.max(vp.offsetWidth / iw, vp.offsetHeight / ih);
                let curX = (vp.offsetWidth - iw * baseScale) / 2;
                let curY = (vp.offsetHeight - ih * baseScale) / 2;

                const render = () => {
                    const ratio = outVp.offsetWidth / vp.offsetWidth; 
                    [inImg, outImg].forEach(img => {
                        const r = img === outImg ? ratio : 1;
                        img.style.width = (iw * baseScale * curZoom * r) + 'px';
                        img.style.height = (ih * baseScale * curZoom * r) + 'px';
                        img.style.left = (curX * r) + 'px';
                        img.style.top = (curY * r) + 'px';
                    });
                };

                const zoomSlider = document.getElementById(`${idPrefix}-zoom`);
                zoomSlider.value = 1;
                zoomSlider.oninput = e => {
                    const oldZoom = curZoom;
                    curZoom = parseFloat(e.target.value);
                    const zoomChange = curZoom / oldZoom;
                    curX = vp.offsetWidth/2 - (vp.offsetWidth/2 - curX) * zoomChange;
                    curY = vp.offsetHeight/2 - (vp.offsetHeight/2 - curY) * zoomChange;
                    render();
                };

                let isDrag = false, sx, sy;
                vp.onmousedown = e => { isDrag = true; sx = e.clientX - curX; sy = e.clientY - curY; };
                window.onmouseup = () => isDrag = false;
                window.onmousemove = e => { if(isDrag) { curX = e.clientX - sx; curY = e.clientY - sy; render(); } };

                render();
            };
        };
        reader.readAsDataURL(input.files[0]);
    }

    function getBorderColor(hex) {
        if(hex.indexOf('#') === 0) hex = hex.slice(1);
        if(hex.length === 3) hex = hex[0] + hex[0] + hex[1] + hex[1] + hex[2] + hex[2];
        const r = parseInt(hex.slice(0, 2), 16), g = parseInt(hex.slice(2, 4), 16), b = parseInt(hex.slice(4, 6), 16);
        const luma = 0.2126 * r + 0.7152 * g + 0.0722 * b;
        return luma < 128 ? 'rgba(255,255,255,0.3)' : 'rgba(0,0,0,0.15)';
    }

    // 🔥 요소 삭제 함수 🔥
    function removeElement(id) {
        const wrap = document.getElementById(`out-${id}-wrap`);
        if (wrap) wrap.remove();
        const ctrl = document.getElementById(`${id}-ctrl`);
        if (ctrl) ctrl.remove();
    }

    function addPolaroid(left=150, top=150, rot=0) {
        pCount++; const id = pCount, pID = `p-${id}`;
        const ctrl = document.createElement('div');
        ctrl.id = `${pID}-ctrl`;
        ctrl.innerHTML = `
            <div style="background:#f1f5f9; border:1px solid #e2e8f0; padding:15px; border-radius:10px; margin-bottom:15px;">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
                    <b style="font-size:0.8rem;">📷 폴라로이드 ${id}</b>
                    <button class="btn-delete" onclick="removeElement('${pID}')">삭제</button>
                </div>
                <label class="file-upload-btn">사진 업로드<input type="file" accept="image/*" onchange="initCrop(this, '${pID}')"></label>
                <div class="crop-ui-box" id="${pID}-ui"><div class="crop-viewport shape-rect" id="${pID}-vp"><img id="${pID}-img"></div><div class="slider-wrap"><span>확대</span><input type="range" id="${pID}-zoom" min="0.5" max="3" step="0.01" value="1"></div></div>
                <input type="text" id="${pID}-txt" placeholder="하단 문구" oninput="syncOuter('${pID}')" style="margin-top:10px;">
                
                <div style="display:flex; gap:10px; margin-top:10px; align-items:center;">
                    <label style="margin:0; font-weight:normal; cursor:pointer;"><input type="checkbox" id="${pID}-border-chk" checked onchange="syncOuter('${pID}')"> 얇은 테두리</label>
                </div>

                <div class="slider-wrap"><span>순서</span><input type="range" id="${pID}-z" min="1" max="1000" value="10" oninput="syncOuter('${pID}')"></div>
                <div class="slider-wrap"><span>크기</span><input type="range" id="${pID}-sz" min="0.5" max="1.5" step="0.05" value="1" oninput="syncOuter('${pID}')"></div>
                <div class="slider-wrap"><span>회전</span><input type="range" id="${pID}-rot" min="-45" max="45" value="${rot}" oninput="syncOuter('${pID}')"></div>
                <div style="display:flex; gap:10px; margin-top:10px;">
                    <div><label>프레임</label><input type="color" id="${pID}-bg" value="#ffffff" oninput="syncOuter('${pID}')"></div>
                    <div><label>글씨</label><input type="color" id="${pID}-tc" value="#334155" oninput="syncOuter('${pID}')"></div>
                </div>
            </div>`;
        document.getElementById('p-list').appendChild(ctrl);
        const wrap = document.createElement('div');
        wrap.id = `out-${pID}-wrap`; wrap.className = 'abs-frame';
        wrap.style.left = left+'px'; wrap.style.top = top+'px';
        
        wrap.innerHTML = `
            <div id="out-${pID}-trans" style="transform: scale(1) rotate(${rot}deg); display: inline-block; transform-origin: center;">
                <div class="polaroid-frame" id="out-${pID}-frame">
                    <div class="out-viewport out-pol" id="out-${pID}-vp"><img id="out-${pID}-img"></div>
                    <div class="p-txt" id="out-${pID}-txt"></div>
                </div>
            </div>`;
        document.getElementById('drag-layer').appendChild(wrap);
        makeOuterDraggable(wrap.id, pID); syncOuter(pID);
    }

    function addFC(left=200, top=100, rot=0) {
        fcCount++; const id = fcCount, fcID = `fc-${id}`;
        let slotsUI = '', slotsOut = '';
        for(let i=1; i<=4; i++) {
            slotsUI += `<label class="file-upload-btn" style="padding:6px; font-size:0.75rem;">사진 ${i} 넣기<input type="file" accept="image/*" onchange="initCrop(this, '${fcID}-${i}')"></label><div class="crop-ui-box" id="${fcID}-${i}-ui" style="padding:10px;"><div class="crop-viewport shape-4cut" id="${fcID}-${i}-vp"><img id="${fcID}-${i}-img"></div><div class="slider-wrap"><span>확대</span><input type="range" id="${fcID}-${i}-zoom" min="0.5" max="3" step="0.01" value="1"></div></div>`;
            slotsOut += `<div class="out-viewport out-fc" id="out-${fcID}-${i}-vp"><img id="out-${fcID}-${i}-img"></div>`;
        }
        const ctrl = document.createElement('div');
        ctrl.id = `${fcID}-ctrl`;
        ctrl.innerHTML = `
            <div style="background:#f1f5f9; border:1px solid #e2e8f0; padding:15px; border-radius:10px; margin-bottom:15px;">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
                    <b style="font-size:0.8rem;">🎞️ 인생네컷 ${id}</b>
                    <button class="btn-delete" onclick="removeElement('${fcID}')">삭제</button>
                </div>
                ${slotsUI}
                <input type="text" id="${fcID}-txt" value="MEMORIES 2026" oninput="syncOuter('${fcID}')" style="margin-top:10px;">
                
                <div style="display:flex; gap:10px; margin-top:10px; align-items:center;">
                    <label style="margin:0; font-weight:normal; cursor:pointer;"><input type="checkbox" id="${fcID}-border-chk" checked onchange="syncOuter('${fcID}')"> 얇은 테두리</label>
                </div>

                <div class="slider-wrap"><span>순서</span><input type="range" id="${fcID}-z" min="1" max="1000" value="10" oninput="syncOuter('${fcID}')"></div>
                <div class="slider-wrap"><span>크기</span><input type="range" id="${fcID}-sz" min="0.5" max="1.5" step="0.05" value="1" oninput="syncOuter('${fcID}')"></div>
                <div class="slider-wrap"><span>회전</span><input type="range" id="${fcID}-rot" min="-45" max="45" value="${rot}" oninput="syncOuter('${fcID}')"></div>
                <div style="display:flex; gap:10px; margin-top:10px;"><div><label>프레임</label><input type="color" id="${fcID}-bg" value="#111111" oninput="syncOuter('${fcID}')"></div><div><label>글씨</label><input type="color" id="${fcID}-tc" value="#ffffff" oninput="syncOuter('${fcID}')"></div></div>
            </div>`;
        document.getElementById('fc-list').appendChild(ctrl);
        const wrap = document.createElement('div');
        wrap.id = `out-${fcID}-wrap`; wrap.className = 'abs-frame';
        wrap.style.left = left+'px'; wrap.style.top = top+'px';
        
        wrap.innerHTML = `
            <div id="out-${fcID}-trans" style="transform: scale(1) rotate(${rot}deg); display: inline-block; transform-origin: center;">
                <div class="four-cut" id="out-${fcID}-frame">
                    ${slotsOut}
                    <div class="fc-txt" id="out-${fcID}-txt">MEMORIES 2026</div>
                </div>
            </div>`;
        document.getElementById('drag-layer').appendChild(wrap);
        makeOuterDraggable(wrap.id, fcID); syncOuter(fcID);
    }

    function syncOuter(id) {
        const wrap = document.getElementById(`out-${id}-wrap`);
        const transBox = document.getElementById(`out-${id}-trans`);
        const sz = document.getElementById(`${id}-sz`).value, rot = document.getElementById(`${id}-rot`).value, z = document.getElementById(`${id}-z`).value;
        wrap.style.zIndex = z;
        transBox.style.transform = `scale(${sz}) rotate(${rot}deg)`;
        
        const frame = document.getElementById(`out-${id}-frame`);
        const bgColor = document.getElementById(`${id}-bg`).value;
        
        if(frame) {
            frame.style.background = bgColor;
            const txt = document.getElementById(`out-${id}-txt`);
            if(txt) { txt.innerText = document.getElementById(`${id}-txt`).value; txt.style.color = document.getElementById(`${id}-tc`).value; }
            
            // 테두리 동기화
            const borderChk = document.getElementById(`${id}-border-chk`);
            if(borderChk && borderChk.checked) {
                frame.style.border = `1px solid ${getBorderColor(bgColor)}`;
            } else {
                frame.style.border = `1px solid transparent`;
            }
        }
    }

    function makeOuterDraggable(id, ctrlId) {
        const el = document.getElementById(id);
        let isDrag = false, sx, sy, il, it;
        el.onmousedown = e => {
            if(e.target.tagName==='INPUT' || e.target.closest('.crop-viewport')) return;
            e.preventDefault(); isDrag = true; sx = e.clientX; sy = e.clientY; il = el.offsetLeft; it = el.offsetTop;
            const curZ = parseInt(el.style.zIndex); el.style.zIndex = 2000;
            document.onmouseup = () => { isDrag = false; el.style.zIndex = document.getElementById(`${ctrlId}-z`).value; };
            document.onmousemove = e => { if(isDrag) { el.style.left = (il + (e.clientX - sx)) + 'px'; el.style.top = (it + (e.clientY - sy)) + 'px'; } };
        };
    }

    function saveImage() {
        const preview = document.getElementById('capture-target'); 
        const btn = document.querySelector('.btn-save');
        btn.innerText = "저장 중...";
        const wrapper = document.getElementById('canvas-wrapper');
        const ox = wrapper.scrollLeft, oy = wrapper.scrollTop;
        wrapper.scrollLeft = 0; wrapper.scrollTop = 0;
        
        html2canvas(preview, { 
            scale: 2, 
            useCORS: true, 
            backgroundColor: null, 
            logging: false 
        }).then(canvas => {
            const link = document.createElement('a'); 
            link.href = canvas.toDataURL('image/png', 1.0); 
            link.download = 'My_Profile.png'; 
            link.click();
            btn.innerText = "[ 고화질 이미지로 저장 ]";
            wrapper.scrollLeft = ox; wrapper.scrollTop = oy;
        });
    }
    init();
</script>
</body>
</html>
